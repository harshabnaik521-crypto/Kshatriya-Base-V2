<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>⚔️ Kshatriya Command V2</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#05071a;--bg2:#080c24;--bg3:#0d1230;
  --gold:#d4a843;--gold2:#f0c460;--gold3:#ffd875;
  --blue:#1a2a6c;--blue2:#2a3f9f;--blue3:#4466dd;
  --text:#e8dfc8;--text2:#a89878;--text3:#6a5f48;
  --red:#c0392b;--green:#27ae60;--pink:#e84393;
  --border:rgba(212,168,67,.2);--border2:rgba(212,168,67,.4);
  --card:rgba(8,12,36,.8);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Crimson Text',serif;color:var(--text);font-size:15px;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--blue2);border-radius:3px;}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;z-index:1;}
#header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px;}
#navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
.h-left{display:flex;align-items:center;gap:10px;}
.h-title{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:2px;}
.h-sub{font-size:10px;color:var(--text3);letter-spacing:1px;}
.h-right{display:flex;align-items:center;gap:8px;}
.balance-pill{display:flex;align-items:center;gap:5px;background:rgba(212,168,67,.1);border:1px solid var(--border2);border-radius:20px;padding:5px 12px;}
.balance-num{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--gold2);}
.balance-lbl{font-size:9px;color:var(--text3);letter-spacing:1px;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'Crimson Text',serif;font-size:9px;border-top:2px solid transparent;transition:all .2s;}
.nav-btn.active{color:var(--gold);border-top-color:var(--gold);}
.nav-icon{font-size:17px;}
.page{padding:16px;animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.card-title{font-family:'Cinzel',serif;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.card-glow{box-shadow:0 0 20px rgba(212,168,67,.08);}
.prog-wrap{background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden;height:7px;margin:8px 0;}
.prog-fill{height:100%;border-radius:6px;transition:width .4s ease;}
.prog-gold{background:linear-gradient(90deg,var(--gold),var(--gold3));}
.prog-blue{background:linear-gradient(90deg,var(--blue2),var(--blue3));}
.prog-pink{background:linear-gradient(90deg,#8b0050,var(--pink));}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.stat-num{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--gold2);}
.stat-lbl{font-size:10px;color:var(--text3);letter-spacing:1px;margin-top:2px;}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;display:inline-block;}
.tag-high{background:rgba(192,57,43,.2);color:#ff6b5b;border:1px solid rgba(192,57,43,.4);}
.tag-med{background:rgba(212,168,67,.15);color:var(--gold2);border:1px solid var(--border2);}
.tag-low{background:rgba(39,174,96,.15);color:#4eff91;border:1px solid rgba(39,174,96,.3);}
.tag-blue{background:rgba(68,102,221,.2);color:#88aaff;border:1px solid rgba(68,102,221,.3);}
.tag-pink{background:rgba(232,67,147,.15);color:var(--pink);border:1px solid rgba(232,67,147,.3);}
.btn{padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;transition:all .2s;}
.btn:active{transform:scale(.95);}
.btn-gold{background:linear-gradient(135deg,#a07820,var(--gold));color:#000;font-weight:700;}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--gold);}
.btn-red{background:rgba(192,57,43,.2);border:1px solid rgba(192,57,43,.4);color:#ff6b5b;}
.btn-pink{background:rgba(232,67,147,.15);border:1px solid rgba(232,67,147,.4);color:var(--pink);}
.btn-sm{padding:6px 12px;font-size:10px;border-radius:8px;}
.btn-full{width:100%;display:block;text-align:center;}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Crimson Text',serif;font-size:14px;outline:none;margin-bottom:10px;}
.inp:focus{border-color:var(--gold);}
.sel{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Crimson Text',serif;font-size:14px;outline:none;margin-bottom:10px;cursor:pointer;}
.sel option{background:var(--bg2);}
.inp-label{font-size:11px;color:var(--text3);letter-spacing:1px;margin-bottom:4px;}
.check-row{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px;margin-bottom:10px;cursor:pointer;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;}
.modal-title{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:16px;}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
#toast-el{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 20px;border-radius:10px;font-size:13px;font-family:'Cinzel',serif;animation:toastIn .3s ease;white-space:nowrap;max-width:90vw;text-align:center;pointer-events:none;}
.toast-s{background:rgba(39,174,96,.15);border:1px solid rgba(39,174,96,.4);color:#4eff91;}
.toast-e{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#ff6b5b;}
.toast-i{background:rgba(68,102,221,.15);border:1px solid rgba(68,102,221,.4);color:#88aaff;}
.toast-p{background:rgba(232,67,147,.15);border:1px solid rgba(232,67,147,.4);color:var(--pink);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.task-row{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;gap:10px;align-items:flex-start;}
.task-row:last-child{border-bottom:none;}
.task-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;margin-top:2px;}
.task-check.done{background:rgba(39,174,96,.2);border-color:var(--green);color:var(--green);}
.task-name{font-size:14px;color:var(--text);margin-bottom:4px;}
.task-name.done{text-decoration:line-through;color:var(--text3);}
.task-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.habit-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.habit-row:last-child{border-bottom:none;}
.habit-left{display:flex;align-items:center;gap:10px;}
.habit-toggle{width:40px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .3s;flex-shrink:0;}
.habit-toggle.on{background:var(--green);}
.habit-toggle.off{background:rgba(255,255,255,.1);}
.habit-toggle::after{content:'';position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .3s;}
.habit-toggle.on::after{left:21px;}
.habit-toggle.off::after{left:3px;}
.pipe-stages{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px;}
.pipe-stage{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:7px 3px;text-align:center;cursor:pointer;transition:all .2s;}
.pipe-stage.active{background:rgba(212,168,67,.1);border-color:var(--gold);}
.pipe-stage.done{background:rgba(39,174,96,.1);border-color:var(--green);}
.pipe-stage-icon{font-size:15px;margin-bottom:2px;}
.pipe-stage-name{font-size:8px;color:var(--text3);}
.pipe-stage.active .pipe-stage-name{color:var(--gold);}
.pipe-stage.done .pipe-stage-name{color:var(--green);}
.pipe-video-row{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.pipe-video-row:last-child{border-bottom:none;}
.meera-scene{display:flex;flex-direction:column;align-items:center;padding:16px 0 8px;}
.meera-bubble{background:rgba(232,67,147,.08);border:1px solid rgba(232,67,147,.25);border-radius:16px 16px 16px 4px;padding:12px 16px;max-width:260px;font-size:13px;color:var(--text);line-height:1.6;margin-top:12px;}
.heart-bar-wrap{width:100%;margin-top:14px;}
.heart-level{font-family:'Cinzel',serif;font-size:11px;color:var(--pink);letter-spacing:2px;text-align:center;margin-bottom:6px;}
.gift-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px;}
.gift-card{background:rgba(232,67,147,.05);border:1px solid rgba(232,67,147,.2);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;}
.gift-card:active{transform:scale(.95);}
.demand-banner{background:rgba(232,67,147,.08);border:1px solid rgba(232,67,147,.3);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.goal-row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.goal-row:last-child{border-bottom:none;}
.goal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.loan-plan-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.loan-plan-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.loan-plan-name{font-family:'Cinzel',serif;font-size:14px;color:var(--text);}
.loan-details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.lbl{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
.val{font-family:'Cinzel',serif;font-size:14px;color:var(--text);}
.active-loan{border-color:var(--gold);}
.active-loan-over{border-color:var(--red);}
.novel-hero{text-align:center;padding:10px 0 16px;}
.novel-title{font-family:'Cinzel',serif;font-size:17px;color:var(--gold2);letter-spacing:2px;margin-bottom:4px;}
.novel-sub{font-size:11px;color:var(--text3);letter-spacing:1px;}
.novel-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
.reward-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.reward-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;}
.reward-card:active{transform:scale(.96);}
.profile-header{text-align:center;padding:10px 0 20px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;}
.profile-name{font-family:'Cinzel',serif;font-size:18px;color:var(--gold2);letter-spacing:2px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.stat-row:last-child{border-bottom:none;}
.stat-row-lbl{font-size:13px;color:var(--text2);}
.stat-row-val{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);}
.empty{text-align:center;padding:28px 0;color:var(--text3);font-size:13px;}
.section-div{font-family:'Cinzel',serif;font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.warn-strip{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.3);border-radius:10px;padding:10px 14px;font-size:12px;color:#ff9a7a;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle linear infinite;}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.6}}
</style>
</head>
<body>
<div id="stars"></div>
<div id="app">
  <div id="header">
    <div class="h-left">
      <span style="font-size:22px;">⚔️</span>
      <div>
        <div class="h-title">KSHATRIYA</div>
        <div class="h-sub">COMMAND V2</div>
      </div>
    </div>
    <div class="h-right">
      <div id="loan-alert" style="display:none;font-size:9px;padding:3px 8px;border-radius:6px;background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#ff6b5b;"></div>
      <div class="balance-pill">
        <span>🪙</span>
        <span class="balance-num" id="h-balance">0</span>
        <span class="balance-lbl">~K~</span>
      </div>
    </div>
  </div>
  <div id="content"></div>
  <nav id="navbar">
    <button class="nav-btn active" data-tab="dashboard" onclick="setTab('dashboard')"><span class="nav-icon">🏠</span><span>Home</span></button>
    <button class="nav-btn" data-tab="tasks" onclick="setTab('tasks')"><span class="nav-icon">⚔️</span><span>Tasks</span></button>
    <button class="nav-btn" data-tab="youtube" onclick="setTab('youtube')"><span class="nav-icon">🎬</span><span>YouTube</span></button>
    <button class="nav-btn" data-tab="novel" onclick="setTab('novel')"><span class="nav-icon">📖</span><span>Novel</span></button>
    <button class="nav-btn" data-tab="meera" onclick="setTab('meera')"><span class="nav-icon">💕</span><span>Meera</span></button>
    <button class="nav-btn" data-tab="more" onclick="setTab('more')"><span class="nav-icon">☰</span><span>More</span></button>
  </nav>
</div>
<div id="toast-el" style="display:none;"></div>
<div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()" id="modal-box"></div>
</div>
<script>
var ld=function(k,fb){try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}};
var sv=function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
var today=function(){return new Date().toISOString().split('T')[0];};
var daysLeft=function(d){if(!d)return null;return Math.ceil((new Date(d)-new Date(today()))/86400000);};
var esc=function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};

// Stars
(function(){
  var s=document.getElementById('stars');
  for(var i=0;i<50;i++){
    var el=document.createElement('div');
    el.className='star';
    var sz=Math.random()*2+.5;
    el.style.cssText='width:'+sz+'px;height:'+sz+'px;top:'+Math.random()*100+'%;left:'+Math.random()*100+'%;animation-duration:'+(3+Math.random()*4)+'s;animation-delay:'+Math.random()*4+'s;';
    s.appendChild(el);
  }
})();

var SAVE_KEYS={
  balance:'kc2_bal',lifetimeEarned:'kc2_life',tasks:'kc2_tasks',
  habits:'kc2_habits',videos:'kc2_videos',novel:'kc2_novel',
  daily:'kc2_daily',weeklyGoals:'kc2_wgoals',rewards:'kc2_rewards',
  spendLog:'kc2_spendlog',loans:'kc2_loans',meera:'kc2_meera',
  kills:'kc2_kills',profile:'kc2_profile'
};

var S={
  balance:ld('kc2_bal',0),
  lifetimeEarned:ld('kc2_life',0),
  tasks:ld('kc2_tasks',[
    {id:1,name:'Script Episode 1',cat:'YouTube',sub:'Mythilo Productions',pri:'High',deadline:'',status:'To Do',reward:50,daily:false},
    {id:2,name:'Write Chapter 4',cat:'Novel',sub:'Echoes Of Kshatriyas',pri:'High',deadline:'',status:'To Do',reward:50,daily:false},
    {id:3,name:'Thumbnail Design',cat:'YouTube',sub:'Saiyan Brothers',pri:'Medium',deadline:'',status:'To Do',reward:25,daily:false},
  ]),
  habits:ld('kc2_habits',[
    {id:1,name:'Wake Up',icon:'🌅',reward:5,streak:0,lastDone:''},
    {id:2,name:'Bathe',icon:'🚿',reward:5,streak:0,lastDone:''},
    {id:3,name:'Breakfast',icon:'🍳',reward:5,streak:0,lastDone:''},
  ]),
  videos:ld('kc2_videos',[{id:1,title:'My First Video',channel:'Mythilo Productions',stage:0,createdAt:today()}]),
  novel:ld('kc2_novel',{totalWords:0,totalPages:0,totalChapters:0,dailyLog:{date:today(),words:0},dailyGoal:100,streak:0,lastWritten:''}),
  daily:ld('kc2_daily',{date:today(),earned:0}),
  weeklyGoals:ld('kc2_wgoals',[
    {id:1,name:'Upload 1 video this week',reward:100,done:false,createdAt:today()},
    {id:2,name:'Write 700 words',reward:80,done:false,createdAt:today()},
  ]),
  rewards:ld('kc2_rewards',[
    {id:1,name:'Play Games',icon:'🎮',cost:30,cat:'Entertainment'},
    {id:2,name:'Watch YouTube',icon:'📺',cost:25,cat:'Entertainment'},
    {id:3,name:'Junk Food',icon:'🍟',cost:40,cat:'Food'},
    {id:4,name:'Special Meal',icon:'🍱',cost:120,cat:'Food'},
    {id:5,name:'Movie Night',icon:'🎬',cost:80,cat:'Entertainment'},
    {id:6,name:'Rest Day',icon:'😴',cost:60,cat:'Rest'},
  ]),
  spendLog:ld('kc2_spendlog',[]),
  loans:ld('kc2_loans',[]),
  meera:ld('kc2_meera',{hearts:0,maxHearts:500,lastInteraction:today(),demand:null,demandTimer:3,giftLog:[]}),
  kills:ld('kc2_kills',0),
  profile:ld('kc2_profile',{name:'Kshatriya',joinDate:today()}),
};

// Daily reset
if(S.daily.date!==today()){S.daily={date:today(),earned:0};sv('kc2_daily',S.daily);}
if(S.novel.dailyLog.date!==today()){S.novel.dailyLog={date:today(),words:0};sv('kc2_novel',S.novel);}

// Meera missed days
(function(){
  var last=S.meera.lastInteraction||today();
  if(last!==today()){
    var diff=Math.ceil((new Date(today())-new Date(last))/86400000);
    if(diff>1){S.meera.hearts=Math.max(0,S.meera.hearts-diff*5);sv('kc2_meera',S.meera);}
  }
})();

// Meera demand generation
if(!S.meera.demand){
  S.meera.demandTimer=(S.meera.demandTimer||3)-1;
  if(S.meera.demandTimer<=0){
    var DEMAND_LIST=[
      {text:'Buy me flowers today!',gift:{name:'Flowers',cost:30,hearts:15,icon:'🌸'}},
      {text:'I want sweet treats!',gift:{name:'Sweet Treats',cost:50,hearts:20,icon:'🍮'}},
      {text:'A love letter please!',gift:{name:'Love Letter',cost:20,hearts:12,icon:'💌'}},
      {text:'Get me something special!',gift:{name:'Gold Jewelry',cost:150,hearts:40,icon:'💍'}},
    ];
    S.meera.demand=DEMAND_LIST[Math.floor(Math.random()*DEMAND_LIST.length)];
    S.meera.demandTimer=5+Math.floor(Math.random()*5);
    sv('kc2_meera',S.meera);
  }
}

var RANKS=[
  {min:0,icon:'🌱',name:'Shishya',sub:'Trainee'},
  {min:200,icon:'⚔️',name:'Sainik',sub:'Soldier'},
  {min:600,icon:'🛡️',name:'Yodha',sub:'Warrior'},
  {min:1500,icon:'🔥',name:'Veer',sub:'Hero'},
  {min:3500,icon:'👑',name:'Kshatriya',sub:'True Warrior'},
  {min:7000,icon:'🌟',name:'Maharathi',sub:'Great Warrior'},
  {min:12000,icon:'⚡',name:'Chakravyuha',sub:'Unbreakable'},
  {min:20000,icon:'🏆',name:'Dharmarakshak',sub:'Protector of Dharma'},
];

function getRank(bal){var r=RANKS[0];for(var i=0;i<RANKS.length;i++){if(bal>=RANKS[i].min)r=RANKS[i];}return r;}
function getNextRank(bal){for(var i=0;i<RANKS.length;i++){if(RANKS[i].min>bal)return RANKS[i];}return null;}

function earn(amt,reason){
  S.balance+=amt;S.lifetimeEarned+=amt;S.daily.earned+=amt;
  sv('kc2_bal',S.balance);sv('kc2_life',S.lifetimeEarned);sv('kc2_daily',S.daily);
  updateHeader();
  showToast('+'+amt+'~K~'+(reason?' '+reason:''),'s');
}

function spend(amt,reason){
  if(S.balance<amt){showToast('Not enough ~K~!','e');return false;}
  S.balance-=amt;
  S.spendLog.unshift({item:reason||'Reward',cost:amt,date:today()});
  sv('kc2_bal',S.balance);sv('kc2_spendlog',S.spendLog.slice(0,30));
  updateHeader();
  showToast('-'+amt+'~K~ spent','i');
  return true;
}

var toastTimer=null;
function showToast(msg,type){
  var el=document.getElementById('toast-el');
  el.className='toast-'+(type||'s');
  el.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;padding:10px 20px;border-radius:10px;font-size:13px;font-family:Cinzel,serif;white-space:nowrap;max-width:90vw;text-align:center;pointer-events:none;display:block;';
  if(type==='s')el.style.cssText+='background:rgba(39,174,96,.15);border:1px solid rgba(39,174,96,.4);color:#4eff91;';
  else if(type==='e')el.style.cssText+='background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#ff6b5b;';
  else if(type==='i')el.style.cssText+='background:rgba(68,102,221,.15);border:1px solid rgba(68,102,221,.4);color:#88aaff;';
  else if(type==='p')el.style.cssText+='background:rgba(232,67,147,.15);border:1px solid rgba(232,67,147,.4);color:#e84393;';
  el.textContent=msg;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.style.display='none';},2800);
}

function getMeeraFace(){
  var hearts=S.meera.hearts;
  var dm=S.daily.earned>=100;
  if(hearts===0)return '😶';
  if(!dm&&hearts>20)return '😢';
  if(S.meera.demand&&hearts>50)return '🥺';
  if(hearts>400)return '🥰';
  if(hearts>200)return '😍';
  if(hearts>100)return '😊';
  if(hearts>50)return '🙂';
  return '😐';
}

function getMeeraMsg(dm){
  var h=S.meera.hearts;
  if(h===0)return 'Hello! I\'m Meera! Gift me something and let\'s be friends! 😊';
  if(!dm)return 'You haven\'t hit your daily goal... I\'m a little sad 😢 Go earn more ~K~!';
  if(S.meera.demand)return S.meera.demand.text+' 🥺 Please?';
  if(h>400)return 'You\'re my favourite warrior! Always cheering for you! 💗✨';
  if(h>200)return 'You\'ve been so kind! I really like you! 😍💕';
  if(h>100)return 'Keep working hard! I believe in you! ❤️⚔️';
  return 'We\'re getting to know each other! Keep gifting me! 🌸';
}

// ACTIONS
function completeTask(id){
  var t=S.tasks.find(function(t){return t.id===id;});
  if(!t||t.status==='Done')return;
  var dr=daysLeft(t.deadline);
  var reward=t.reward;
  if(t.deadline){if(dr>=0)reward+=15;else reward=Math.max(0,reward-10);}
  t.status='Done';t.completedDate=today();
  sv('kc2_tasks',S.tasks);
  earn(reward,'Task complete!');
  S.kills++;sv('kc2_kills',S.kills);
  S.meera.hearts=Math.min(S.meera.maxHearts,S.meera.hearts+2);
  S.meera.lastInteraction=today();
  sv('kc2_meera',S.meera);
  renderPage();
}

function deleteTask(id){S.tasks=S.tasks.filter(function(t){return t.id!==id;});sv('kc2_tasks',S.tasks);renderPage();}

function toggleHabit(id){
  var hb=S.habits.find(function(h){return h.id===id;});if(!hb)return;
  if(hb.lastDone===today()){
    hb.lastDone='';hb.streak=Math.max(0,hb.streak-1);
  }else{
    var yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    var yStr=yesterday.toISOString().split('T')[0];
    hb.streak=hb.lastDone===yStr?hb.streak+1:1;
    hb.lastDone=today();
    earn(hb.reward,'Habit done!');
    S.meera.hearts=Math.min(S.meera.maxHearts,S.meera.hearts+1);
    S.meera.lastInteraction=today();
    sv('kc2_meera',S.meera);
  }
  sv('kc2_habits',S.habits);renderPage();
}

function logWords(){
  var inp=document.getElementById('word-inp');
  if(!inp)return;
  var words=parseInt(inp.value);
  if(isNaN(words)||words<=0){showToast('Enter valid word count','e');return;}
  S.novel.dailyLog.words+=words;S.novel.totalWords+=words;
  var goalMet=S.novel.dailyLog.words>=S.novel.dailyGoal;
  if(goalMet&&S.novel.lastWritten!==today()){
    S.novel.lastWritten=today();
    var yesterday2=new Date();yesterday2.setDate(yesterday2.getDate()-1);
    var yStr2=yesterday2.toISOString().split('T')[0];
    S.novel.streak=S.novel.lastWritten===yStr2?S.novel.streak+1:1;
    earn(20,'Daily writing goal!');
    S.meera.hearts=Math.min(S.meera.maxHearts,S.meera.hearts+3);
    showToast('🔥 Writing streak: '+S.novel.streak+' days!','s');
  }else{
    earn(Math.max(1,Math.floor(words/10)),'Writing ~K~');
  }
  sv('kc2_novel',S.novel);sv('kc2_meera',S.meera);renderPage();
}

function updateNovelProgress(){
  var p=document.getElementById('pages-inp');

  if(c)S.novel.totalChapters=parseInt(c.value)||S.novel.totalChapters;

function takeLoan(planId,planName,amount,days,interest){
  if(S.loans.find(function(l){return!l.repaid;})){showToast('Clear existing loan first!','e');return;}
  var due=new Date();due.setDate(due.getDate()+days);
  var owed=Math.ceil(amount*(1+interest*days));
  var loan={id:Date.now(),plan:planName,principal:amount,interest:interest,days:days,dueDate:due.toISOString().split('T')[0],totalOwed:owed,repaid:false};
  S.loans.push(loan);S.balance+=amount;S.lifetimeEarned+=amount;
  sv('kc2_loans',S.loans);sv('kc2_bal',S.balance);sv('kc2_life',S.lifetimeEarned);
  updateHeader();showToast('Loan approved! +'+amount+'~K~ (Repay '+owed+'~K~ in '+days+'d)','i');
  showMoreSection('bank');
}

function repayLoan(id){
  var l=S.loans.find(function(l){return l.id===id;});if(!l)return;
  var dr=daysLeft(l.dueDate);
  var lf=dr!==null&&dr<0?Math.abs(dr)*5:0;
  var total=l.totalOwed+lf;
  if(S.balance<total){showToast('Need '+total+'~K~ to repay!','e');return;}
  S.balance-=total;l.repaid=true;
  sv('kc2_loans',S.loans);sv('kc2_bal',S.balance);
  updateHeader();showToast('Loan cleared! -'+total+'~K~'+(lf?' (+'+lf+' late fee)':''),'i');
  showMoreSection('bank');
}

function exportData(){
  var data=JSON.stringify({state:S,exportDate:today(),version:'2.1'},null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='kshatriya-backup-'+today()+'.json';
  a.click();URL.revokeObjectURL(url);
  showToast('Data exported!','s');
}

function importData(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var imp=data.state||data.S;
      if(imp){
        Object.assign(S,imp);
        Object.keys(SAVE_KEYS).forEach(function(k){if(S[k]!==undefined)sv(SAVE_KEYS[k],S[k]);});
        updateHeader();renderPage();showToast('Data imported!','s');
      }else{showToast('Invalid backup!','e');}
    }catch(err){showToast('Invalid backup!','e');}
  };
  reader.readAsText(file);
}

updateHeader();
renderPage();
